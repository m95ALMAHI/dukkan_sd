<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tenant.name }} | المتجر الرسمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="#" class="text-xl font-extrabold text-slate-900">{{ tenant.name }}</a>
            <button onclick="openCartModal()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl flex items-center gap-2">
                سلة المشتريات 🛒 (<span id="cartCount">0</span>)
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            {% for product in products %}
            <div class="bg-white border border-slate-100 rounded-2xl p-4 flex flex-col justify-between">
                <div>
                    <div class="aspect-square bg-slate-100 rounded-xl overflow-hidden mb-4">
                        {% if product.image_url %}
                        <img src="{{ product.image_url }}" alt="{{ product.name }}" class="w-full h-full object-cover">
                        {% else %}
                        <div class="w-full h-full flex items-center justify-center text-slate-300 text-3xl">📦</div>
                        {% endif %}
                    </div>
                    <h3 class="font-bold text-slate-900 text-sm">{{ product.name }}</h3>
                    <p class="text-slate-500 text-xs mt-1 line-clamp-2">{{ product.description or '' }}</p>
                </div>
                <div class="mt-4 pt-3 border-t border-slate-50 flex items-center justify-between">
                    <span class="text-sm font-bold text-emerald-600">{{ "{:,.2f}".format(product.price) }} SDG</span>
                    <button onclick="addToCart('{{ product.name }}', '{{ product.price }}')" class="bg-slate-900 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg">أضف للسلة</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <div id="cartModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6">
            <h3 class="text-base font-bold text-slate-900 mb-4">سلة المشتريات الخاصة بك 🛒</h3>
            <div id="cartItems" class="space-y-3 mb-6 max-h-48 overflow-y-auto"></div>
            
            <div class="border-t border-slate-100 pt-4 space-y-3">
                <div class="flex justify-between font-bold text-sm">
                    <span>المجموع الإجمالي:</span>
                    <span id="cartTotal">0.00 SDG</span>
                </div>
                <input type="text" id="custName" placeholder="الاسم بالكامل" class="w-full px-4 py-2.5 rounded-xl border text-sm">
                <input type="text" id="custLoc" placeholder="عنوان التوصيل بالتفصيل" class="w-full px-4 py-2.5 rounded-xl border text-sm">
                <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs">إرسال الطلب للتاجر عبر واتساب 💬</button>
                <button onclick="closeCartModal()" class="w-full bg-slate-100 py-2.5 rounded-xl text-xs font-bold">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            cart.push({name, price: parseFloat(price)});
            document.getElementById('cartCount').innerText = cart.length;
            alert(`تم إضافة ${name} إلى السلة!`);
        }

        function openCartModal() {
            const container = document.getElementById('cartItems');
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `
                    <div class="flex justify-between text-xs py-1 border-b">
                        <span>${item.name}</span>
                        <span class="font-bold">${item.price} SDG</span>
                    </div>`;
            });
            document.getElementById('cartTotal').innerText = total.toFixed(2) + ' SDG';
            document.getElementById('cartModal').classList.replace('hidden', 'flex');
        }

        function closeCartModal() { document.getElementById('cartModal').classList.replace('flex', 'hidden'); }

        function checkoutWhatsApp() {
            const name = document.getElementById('custName').value;
            const loc = document.getElementById('custLoc').value;
            if(!name || !loc || cart.length === 0) { alert('الرجاء تعبئة بيانات التوصيل وإضافة منتجات للسلة!'); return; }

            let itemsText = cart.map(i => `- ${i.name} (${i.price} SDG)`).join('\n');
            let total = cart.reduce((acc, i) => acc + i.price, 0);
            
            const message = `مرحباً، أود تقديم طلب شراء عبر موقعكم:\n\n` +
                            `🛍️ *الطلبات:*\n${itemsText}\n\n` +
                            `💰 *المجموع:* ${total.toFixed(2)} SDG\n\n` +
                            `👤 *بيانات العميل:*\n- الاسم: ${name}\n- العنوان: ${loc}\n\nتم التوليد بواسطة DukkanSD.`;

            const whatsappNumber = "{{ tenant.whatsapp_number }}";
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>
</body>
</html>

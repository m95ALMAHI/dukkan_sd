<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | DukkanSD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-100 shadow-xl">
        <h2 class="text-2xl font-black text-slate-950 mb-2">تسجيل الدخول لوحتك 🏪</h2>
        <p class="text-slate-500 text-sm mb-6">أدخل البريد الإلكتروني وكلمة المرور للتحكم بمتجرك.</p>
        
        {% if error %}
        <div class="bg-rose-50 text-rose-650 p-4 rounded-xl text-xs font-bold mb-4">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <input type="email" name="email" placeholder="بريدك الإلكتروني" required class="w-full px-4 py-3 rounded-xl border text-sm">
            <input type="password" name="password" placeholder="كلمة المرور" required class="w-full px-4 py-3 rounded-xl border text-sm">
            <button type="submit" class="w-full bg-slate-950 text-white font-bold py-3.5 rounded-xl text-xs hover:bg-slate-800 transition">دخول</button>
        </form>
    </div>
</body>
</html>

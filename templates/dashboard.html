<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DukkanSD SaaS - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
        #reader {
            width: 100% !important;
            border: none !important;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        #reader video {
            object-fit: cover !important;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-slate-900 text-white flex-shrink-0 hidden md:flex flex-col">
            <div class="p-5 text-center border-b border-slate-800">
                <h1 class="text-2xl font-bold text-emerald-400"><i class="fa-solid fa-shop ml-2"></i>DukkanSD</h1>
                <p class="text-xs text-slate-400 mt-1">إدارة المنتجات الذكية</p>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="flex items-center p-3 text-emerald-400 bg-slate-800 rounded-lg">
                    <i class="fa-solid fa-chart-line w-6"></i>
                    <span>الرئيسية</span>
                </a>
                <a href="#products-section" class="flex items-center p-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition">
                    <i class="fa-solid fa-box w-6"></i>
                    <span>المنتجات</span>
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between">
                <button class="md:hidden text-gray-600 focus:outline-none">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div class="flex items-center space-x-4 space-x-reverse mr-auto">
                    <span class="text-sm font-medium text-gray-600">أهلاً بك، مصطفى</span>
                    <div class="w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold">
                        M
                    </div>
                </div>
            </header>

            <div class="p-6 max-w-7xl mx-auto w-full space-y-6">
                
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center">
                        <i class="fa-solid fa-circle-plus text-emerald-500 ml-2"></i>
                        إضافة منتج جديد للمتجر
                    </h2>

                    <form id="productForm" method="POST" action="/add_product" enctype="multipart/form-data" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">اسم المنتج *</label>
                                <input type="text" name="name" required class="w-full border-gray-200 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 shadow-sm" placeholder="مثال: لابتوب ديل 15 بوصة">
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">القسم (Category) *</label>
                                <select name="category" id="categorySelect" required class="w-full border-gray-200 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 shadow-sm">
                                    <option value="">اختر القسم...</option>
                                    <option value="laptops">أجهزة لابتوب وحواسب</option>
                                    <option value="phones">هواتف ذكية وملحقاتها</option>
                                    <option value="clothes">ملابس وأزياء</option>
                                    <option value="other">أقسام أخرى</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">الماركة (Brand) *</label>
                                <input type="text" name="brand" required class="w-full border-gray-200 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 shadow-sm" placeholder="مثال: HP, Apple, Samsung">
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">السعر *</label>
                                <div class="relative">
                                    <input type="number" step="0.01" name="price" required class="w-full border-gray-200 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 shadow-sm pr-4 pl-12" placeholder="0.00">
                                    <span class="absolute left-3 top-2 text-gray-400 text-sm">SDG</span>
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">الباركود (Barcode)</label>
                                <div class="flex space-x-2 space-x-reverse">
                                    <input type="text" id="barcodeInput" name="barcode" class="w-full border-gray-200 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 shadow-sm" placeholder="أدخل الرقم أو امسحه بالكاميرا">
                                    <button type="button" data-modal-target="barcodeModal" data-modal-toggle="barcodeModal" onclick="startScanner()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg flex items-center justify-center transition">
                                        <i class="fa-solid fa-camera text-lg"></i>
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">صورة المنتج</label>
                                <div class="flex items-center justify-center w-full">
                                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition relative overflow-hidden">
                                        <div class="flex flex-col items-center justify-center pt-5 pb-6" id="uploadPlaceholder">
                                            <i class="fa-solid fa-image text-gray-400 text-2xl mb-2"></i>
                                            <p class="text-xs text-gray-500"><span class="font-semibold">اضغط لاختيار صورة</span></p>
                                            <p class="text-[10px] text-gray-400 mt-1">المعرض أو كاميرا الهاتف</p>
                                        </div>
                                        <input type="file" name="image" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
                                        <img id="imagePreview" class="absolute inset-0 w-full h-full object-cover hidden" alt="معاينة الصورة">
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="border-t border-gray-100 pt-6">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-md font-bold text-gray-800">المواصفات الفنية للمنتج</h3>
                                <button type="button" onclick="addNewSpecification()" class="text-sm bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-3 py-1.5 rounded-lg font-semibold transition">
                                    <i class="fa-solid fa-plus ml-1"></i> إضافة ميزة مخصصة
                                </button>
                            </div>
                            
                            <div id="specificationsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                </div>
                            <input type="hidden" name="specifications" id="specificationsJson">
                        </div>

                        <div class="flex justify-end pt-4 border-t border-gray-100">
                            <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-8 py-3 rounded-lg shadow-md transition">
                                <i class="fa-solid fa-save ml-2"></i> حفظ المنتج ونشره
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <div id="barcodeModal" tabindex="-1" aria-hidden="true" class="fixed top-0 left-0 right-0 z-50 hidden w-full p-4 overflow-x-hidden overflow-y-auto md:inset-0 h-[calc(100%-1rem)] max-h-full bg-slate-900/60 flex items-center justify-center">
        <div class="relative w-full max-w-md max-h-full bg-white rounded-xl shadow-lg">
            <div class="flex items-center justify-between p-4 border-b border-gray-100">
                <h3 class="text-lg font-bold text-gray-900">
                    <i class="fa-solid fa-qrcode ml-2 text-emerald-500"></i> مسح باركود المنتج بالكاميرا
                </h3>
                <button type="button" onclick="stopScanner()" data-modal-hide="barcodeModal" class="text-gray-400 hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 inline-flex justify-center items-center">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <p class="text-xs text-gray-500 mb-2">وجه الكاميرا نحو الباركود بشكل موازي ليتم التعرف التلقائي.</p>
                <div class="overflow-hidden rounded-lg shadow-inner bg-black relative">
                    <div id="reader"></div>
                </div>
                <button type="button" id="manualScanBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-lg transition flex items-center justify-center">
                    <i class="fa-solid fa-camera-retro ml-2"></i> التقاط وإعادة تركيز الكاميرا يدوياً
                </button>
            </div>
            <div class="flex items-center justify-between p-4 border-t border-gray-100">
                <span class="text-xs text-gray-400" id="scanStatus">جاري تهيئة الكاميرا...</span>
                <button type="button" onclick="stopScanner()" data-modal-hide="barcodeModal" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-4 py-2 rounded-lg transition">
                    إغلاق الكاميرا
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>

    <script>
        // ------------------ 1. رفع ومعاينة الصور من الموبايل ------------------
        function previewImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('uploadPlaceholder');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        // ------------------ 2. كود مسح الباركود بالكاميرا (محسّن وسريع) ------------------
        let html5QrcodeScanner;

        function startScanner() {
            document.getElementById('scanStatus').innerText = "جاري فتح الكاميرا الخلفية...";
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            const config = { 
                fps: 25, // زيادة عدد الإطارات لتسريع التعرف
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    return {
                        width: Math.floor(viewfinderWidth * 0.85),
                        height: Math.floor(viewfinderHeight * 0.45)
                    };
                },
                aspectRatio: 1.333333
            };

            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config,
                (decodedText, decodedResult) => {
                    handleScanSuccess(decodedText);
                },
                (errorMessage) => {
                    document.getElementById('scanStatus').innerText = "ابحث عن الباركود في المستطيل...";
                }
            ).then(() => {
                document.getElementById('scanStatus').innerText = "الكاميرا تعمل بنشاط ✅";
            }).catch(err => {
                console.error(err);
                document.getElementById('scanStatus').innerText = "تعذر تشغيل الكاميرا";
                alert("برجاء إعطاء المتصفح إذن الوصول للكاميرا من إعدادات الهاتف.");
            });
        }

        // تحسين زر إعادة ضبط التركيز اليدوي
        document.getElementById('manualScanBtn').addEventListener('click', () => {
            document.getElementById('scanStatus').innerText = "جاري إعادة توجيه الفوكس والتحليل...";
            if(html5QrcodeScanner) {
                const videoTrack = html5QrcodeScanner.getVideoTrack();
                if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
                    videoTrack.applyConstraints({
                        advanced: [{focusMode: "continuous"}]
                    }).then(() => {
                        document.getElementById('scanStatus').innerText = "تمت إعادة التركيز التلقائي ✅";
                    }).catch(e => {
                        console.log("Focus constraint not supported by this browser");
                    });
                }
            }
        });

        function handleScanSuccess(decodedText) {
            document.getElementById('barcodeInput').value = decodedText;
            
            // نغمة نجاح خفيفة
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-600.wav');
            audio.play().catch(e => console.log("Audio play blocked"));

            stopScanner();
            
            const closeBtn = document.querySelector('[data-modal-hide="barcodeModal"]');
            if (closeBtn) closeBtn.click();
        }

        function stopScanner() {
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                html5QrcodeScanner.stop().then(() => {
                    console.log("Camera Stopped");
                }).catch((err) => {
                    console.error("Stop error: ", err);
                });
            }
        }

        // ------------------ 3. معالجة وتوليد حقول المواصفات ------------------
        const defaultSpecs = {
            laptops: [
                { key: "المعالج (CPU)", value: "" },
                { key: "الرام (RAM)", value: "" },
                { key: "الهارد (Storage)", value: "" },
                { key: "كرت الشاشة", value: "" }
            ],
            phones: [
                { key: "البطارية", value: "" },
                { key: "الرام", value: "" },
                { key: "المساحة الداخلية", value: "" }
            ],
            clothes: [
                { key: "المقاس", value: "" },
                { key: "نوع الخامة", value: "" }
            ],
            other: []
        };

        const categorySelect = document.getElementById('categorySelect');
        const specsContainer = document.getElementById('specificationsContainer');

        categorySelect.addEventListener('change', function() {
            const category = this.value;
            specsContainer.innerHTML = '';
            if (defaultSpecs[category]) {
                defaultSpecs[category].forEach(spec => {
                    addNewSpecification(spec.key, spec.value);
                });
            }
        });

        function addNewSpecification(key = "", value = "") {
            const specId = 'spec_' + Date.now() + Math.random().toString(36).substr(2, 5);
            const html = `
                <div class="flex items-center space-x-2 space-x-reverse bg-gray-50 p-2.5 rounded-lg border border-gray-150" id="${specId}">
                    <input type="text" value="${key}" placeholder="الميزة" class="spec-key w-1/3 border-gray-200 rounded-lg text-sm focus:ring-emerald-500 focus:border-emerald-500">
                    <input type="text" value="${value}" placeholder="القيمة" class="spec-value w-2/3 border-gray-200 rounded-lg text-sm focus:ring-emerald-500 focus:border-emerald-500">
                    <button type="button" onclick="document.getElementById('${specId}').remove()" class="text-red-500 hover:text-red-700 p-1.5 transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `;
            specsContainer.insertAdjacentHTML('beforeend', html);
        }

        // ------------------ 4. معالجة الحفظ والرفع لـ Flask بالتفصيل ------------------
        const productForm = document.getElementById('productForm');
        
        productForm.addEventListener('submit', function(e) {
            // تجميع حقول المواصفات في كائن JSON
            const specs = {};
            const keys = document.querySelectorAll('.spec-key');
            const values = document.querySelectorAll('.spec-value');
            
            keys.forEach((keyEl, index) => {
                const k = keyEl.value.trim();
                const v = values[index].value.trim();
                if (k && v) {
                    specs[k] = v;
                }
            });

            // تعبئة الحقل المخفي بالـ JSON String قبل الإرسال الفعلي للفورم
            document.getElementById('specificationsJson').value = JSON.stringify(specs);

            // نترك الفورم يكمل مسار إرساله الطبيعي (Action="/add_product") لضمان تحديث الصفحة بنجاح وسرعة!
        });
    </script>
</body>
</html>
